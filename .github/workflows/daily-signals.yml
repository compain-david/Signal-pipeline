name: Daily Signal Fetch

on:
  schedule:
    # 06:00 UTC daily — adjust if you want it aligned closer to your Sunday review
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write  # needed to commit the data/ output back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run signal fetcher
        env:
          # These stay undefined until you add them under
          # Settings -> Secrets and variables -> Actions -> New repository secret.
          # The script degrades gracefully if any are missing.
          GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
          CRYPTOQUANT_API_KEY: ${{ secrets.CRYPTOQUANT_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
        run: python scripts/fetch_signals.py

      - name: Commit updated data
        run: |
          git config user.name "signal-pipeline-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily signal snapshot $(date -u +%Y-%m-%d)"
          git push
